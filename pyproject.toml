[project]
name = "syntexophobic"
version = "0.1.0"
description = "2.5D CAM for GRBL machines with git-style job history"
readme = "README.md"
authors = [
    { name = "phobicdotno", email = "spamme.post@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp>=8.0.1.1.0",
    "numpy>=2.5.3",
    "pyclipper>=1.4.0",
    "pyside6>=6.12.0",
]

[project.scripts]
syntexophobic = "syntexophobic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
