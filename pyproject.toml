[project]
name = "syntexophobic"
version = "0.5.0"
description = "2.5D CAM for GRBL machines with git-style job history"
readme = "README.md"
authors = [
    { name = "phobicdotno", email = "spamme.post@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp>=8.0.1.1.0",
    "ezdxf>=1.4.4",
    "mcp>=2.3.0",
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "pyclipper>=1.4.0",
    "pyside6>=6.12.0",
]

[project.optional-dependencies]
# NVIDIA GPUs. For AMD ROCm install a ROCm build of CuPy instead (see CuPy's docs).
cuda = ["cupy-cuda12x>=13"]

[project.scripts]
syntexophobic = "syntexophobic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = "-n auto -p no:cacheprovider"
