# A version tag (v0.6.3) builds the Linux AppImage with its .blocks file, the macOS app and the Windows build
# (zip and installer),
# tries each one, and publishes them as that version's GitHub release, its notes taken
# from CHANGELOG.md. Pull requests that change the build only build and try them. Run by hand
# (Actions → Release → Run workflow) with "publish" ticked, it releases the version in
# pyproject.toml from the chosen branch and makes its tag.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - tools/build-*.sh
      - tools/windows/**
      - tools/appimage_prune.py
      - tools/smoke.py
      - tools/release_notes.py
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in pyproject.toml as a release (makes its tag)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # the oldest supported Ubuntu, so the AppImage's bundled git and xcb libraries run on older desktops too
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - name: appimagetool, git and the libraries the AppImage carries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq git xvfb libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxcb-xkb1 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libgl1-mesa-dri    # for trying it on xvfb
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ~/.local/bin/appimagetool
      - run: ./tools/build-appimage.sh
      - name: Try it
        timeout-minutes: 10
        # on a virtual X display with Mesa's GL, as a desktop has: VTK crashes now and then
        # drawing the translucent stock without any GL (Qt's offscreen platform)
        run: |
          QT_QPA_PLATFORM=xcb xvfb-run -a build/AppDir/usr/python/bin/python3 tools/smoke.py
          ./dist/*.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  macos:
    runs-on: macos-15          # Apple silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: ./tools/build-macos.sh
      - name: Try it, unzipped as a download would be
        timeout-minutes: 10
        run: |
          mkdir -p build/try && ditto -x -k dist/*.zip build/try
          APP=build/try/Syntexophobic.app/Contents
          $APP/MacOS/Syntexophobic --version
          $APP/MacOS/python3 tools/smoke.py --no-show      # the runner has no GPU: VTK cannot draw
          if [ -x $APP/Resources/git/git ]; then $APP/Resources/git/git --version; fi
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-2022      # has MinGW's gcc and windres for the launcher
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: WiX, for the installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - run: ./tools/build-windows.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Try it, unzipped as a download would be
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z x -bd -y -obuild/try dist/*.zip >/dev/null
          ./tools/windows/ci-mesa.sh build/try/Syntexophobic/python   # the runner has no GPU
          cd build/try/Syntexophobic
          ./Syntexophobic.exe --version | tee version.txt
          grep -q Syntexophobic version.txt
          ./python/python.exe ../../../tools/smoke.py
          ./git/cmd/git.exe --version
      - name: Install it, start it and uninstall it, as a user would
        shell: pwsh
        timeout-minutes: 10
        run: |
          $msi = (Get-Item dist/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Syntexophobic"
          $reg = (Get-ItemProperty HKCU:\Software\Syntexophobic).InstallFolder
          if ($reg.TrimEnd('\') -ne $dir) { throw "InstallFolder is $reg" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Syntexophobic.lnk")) { throw "no Start menu entry" }
          $v = & "$dir\Syntexophobic.exe" --version | Out-String
          Write-Output $v
          if ($v -notmatch 'Syntexophobic') { throw "it did not start" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'uninstall.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content uninstall.log -Tail 60; throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20; throw "uninstall left $dir" }
      - name: Install it by hand, through its pages, and photograph them
        shell: pwsh
        timeout-minutes: 10
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition @'
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class Win {
            delegate bool Each(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(Each f, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr p, Each f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            public struct RECT { public int L, T, R, B; }
            static string Text(IntPtr h) { var s = new StringBuilder(512); GetWindowText(h, s, 512); return s.ToString(); }
            static string Class(IntPtr h) { var s = new StringBuilder(256); GetClassName(h, s, 256); return s.ToString(); }
            static List<IntPtr> Tops() { var a = new List<IntPtr>(); EnumWindows((h, l) => { if (IsWindowVisible(h)) a.Add(h); return true; }, IntPtr.Zero); return a; }
            static List<IntPtr> Kids(IntPtr p) { var a = new List<IntPtr>(); EnumChildWindows(p, (h, l) => { a.Add(h); return true; }, IntPtr.Zero); return a; }
            // the visible window titled so, with a visible control showing that text
            public static IntPtr Page(string title, string control) {
              foreach (var t in Tops()) if (Text(t) == title)
                foreach (var k in Kids(t)) if (IsWindowVisible(k) && Text(k) == control) return t;
              return IntPtr.Zero;
            }
            public static string Dump() {
              var o = new StringBuilder();
              foreach (var t in Tops()) { var x = Text(t); if (x.Length == 0) continue;
                o.AppendLine("[" + Class(t) + "] " + x);
                foreach (var k in Kids(t)) o.AppendLine("    " + Class(k) + ": " + Text(k)); }
              return o.ToString();
            }
          }
          '@
          New-Item -ItemType Directory -Force pages | Out-Null
          function Wait-Page($button) {           # the installer's window, once it shows that button
            for ($i = 0; $i -lt 240; $i++) {
              $h = [Win]::Page('Syntexophobic Setup', $button)
              if ($h -ne [IntPtr]::Zero) { Start-Sleep 2; return $h }
              Start-Sleep -Milliseconds 500
            }
            Write-Output ([Win]::Dump())
            if (Test-Path install-ui.log) { Get-Content install-ui.log -Tail 40 }
            throw "the installer page with $button did not show"
          }
          function Shoot($h, $name) {
            $r = New-Object Win+RECT; [Win]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T)
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("$PWD/pages/$name.png")
          }
          function Press($h) { [Win]::SetForegroundWindow($h) | Out-Null; Start-Sleep 1; [System.Windows.Forms.SendKeys]::SendWait('{ENTER}') }
          $msi = (Get-Item dist/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/l*v', 'install-ui.log' -PassThru
          $h = Wait-Page '&Install'
          Shoot $h '1-splash'
          Press $h                                   # Install
          $h = Wait-Page 'OK'
          Shoot $h '2-done'
          Press $h                                   # OK
          if (-not $p.WaitForExit(60000)) { throw 'the installer did not close on OK' }
          if ($p.ExitCode) { Get-Content install-ui.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Syntexophobic\Syntexophobic.exe")) { throw 'nothing installed' }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }
          foreach ($f in Get-ChildItem pages/*.png) {    # also in the log, for whoever cannot download artifacts
            Write-Output "::group::$($f.Name) as base64"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName)) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { "b64 $_" }
            Write-Output '::endgroup::'
          }
      - uses: actions/upload-artifact@v5
        if: always() && github.event_name == 'pull_request'
        with:
          name: installer-pages
          path: |
            pages/*.png
            install-ui.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            V=${GITHUB_REF_NAME#v}; TAG=(--verify-tag)
          else                       # run by hand: the tag is made on this commit
            V=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml); TAG=(--target "$GITHUB_SHA")
          fi
          python3 tools/release_notes.py "$V" notes > notes.md
          gh release create "v$V" dist/* "${TAG[@]}" \
            --title "$(python3 tools/release_notes.py "$V" title)" --notes-file notes.md
