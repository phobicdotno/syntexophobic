# A version tag (v0.6.3) builds the Linux AppImage with its .blocks file, the macOS app and the Windows build,
# tries each one, and publishes them as that version's GitHub release, its notes taken
# from CHANGELOG.md. Pull requests that change the build only build and try them.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - tools/build-*.sh
      - tools/appimage_prune.py
      - tools/smoke.py
      - tools/release_notes.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # the oldest supported Ubuntu, so the AppImage's bundled git and xcb libraries run on older desktops too
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - name: appimagetool, git and the libraries the AppImage carries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq git libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxcb-xkb1 libxkbcommon-x11-0
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ~/.local/bin/appimagetool
      - run: ./tools/build-appimage.sh
      - name: Try it
        timeout-minutes: 10
        run: |
          build/AppDir/usr/python/bin/python3 tools/smoke.py
          ./dist/*.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  macos:
    runs-on: macos-15          # Apple silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: ./tools/build-macos.sh
      - name: Try it, unzipped as a download would be
        timeout-minutes: 10
        run: |
          mkdir -p build/try && ditto -x -k dist/*.zip build/try
          APP=build/try/Syntexophobic.app/Contents
          $APP/MacOS/Syntexophobic --version
          $APP/MacOS/python3 tools/smoke.py
          if [ -x $APP/Resources/git/git ]; then $APP/Resources/git/git --version; fi
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-2022      # has MinGW's gcc and windres for the launcher
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: ./tools/build-windows.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Try it, unzipped as a download would be
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z x -bd -y -obuild/try dist/*.zip >/dev/null
          ./tools/windows/ci-mesa.sh build/try/Syntexophobic/python   # the runner has no GPU
          cd build/try/Syntexophobic
          ./Syntexophobic.exe --version | tee version.txt
          grep -q Syntexophobic version.txt
          ./python/python.exe ../../../tools/smoke.py
          ./git/cmd/git.exe --version
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          python3 tools/release_notes.py "$V" notes > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$(python3 tools/release_notes.py "$V" title)" --notes-file notes.md
