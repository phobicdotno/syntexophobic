name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: uv sync --locked
      - name: Software OpenGL for VTK (the runner has no GPU)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/windows/ci-mesa.sh "$(uv run python -c 'import sys, os; print(os.path.dirname(sys._base_executable))')"
      # Linux without a window: tests/conftest.py picks offscreen. GitHub's macOS runners have no
      # GPU and VTK's first render never returns there, so the window tests run on Linux and Windows.
      - run: uv run pytest -q ${{ runner.os == 'macOS' && '--ignore=tests/test_window.py' || '' }}
      - name: Timings (what a user waits for)
        if: runner.os != 'macOS'
        run: uv run python tools/perf.py
